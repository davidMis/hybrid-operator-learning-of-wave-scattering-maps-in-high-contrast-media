# One-epoch protocol for adapting residual scOT to the output of a frozen FNO.
# A physical batch of 8 with four-step gradient accumulation preserves an
# effective batch size of 32 while reducing GPU memory use.
batch_size: 8
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
weight_decay: 1.0e-4
max_grad_norm: 1.0
workers: 4
deterministic: true
allow_tf32: false
